<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test - サンプルページ</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1f2328;
      --muted: #59636e;
      --card: #ffffff;
      --border: #d8dee4;
      --accent: #0969da;
      --green: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --card: #161b22;
        --border: #30363d;
        --accent: #4493f8;
        --green: #238636;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 32px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 1.1rem; margin: 0 0 8px; }
    .card p { margin: 0; }
    button {
      font: inherit;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--green);
      background: var(--green);
      color: #fff;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .count { font-size: 2rem; font-weight: 700; margin: 0 16px; vertical-align: middle; color: var(--green); }
    footer { color: var(--muted); font-size: 0.875rem; margin-top: 32px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>こんにちは、GitHub Pages！</h1>
    <p class="lead">このページは GitHub Pages で公開しているサンプルです。</p>

    <section class="card">
      <h2>このページについて</h2>
      <p>リポジトリ直下の <code>index.html</code> がそのままトップページとして表示されます。</p>
    </section>

    <section class="card">
      <h2>カウンター</h2>
      <button id="minus" type="button">−</button>
      <span class="count" id="count">0</span>
      <button id="plus" type="button">＋</button>
    </section>

    <section class="card">
      <h2>現在時刻</h2>
      <p id="clock">--:--:--</p>
    </section>

    <footer>&copy; <span id="year"></span> test</footer>
  </main>

  <script>
    let count = 0;
    const countEl = document.getElementById("count");
    document.getElementById("plus").addEventListener("click", () => { countEl.textContent = ++count; });
    document.getElementById("minus").addEventListener("click", () => { countEl.textContent = --count; });

    const clockEl = document.getElementById("clock");
    const tick = () => { clockEl.textContent = new Date().toLocaleTimeString("ja-JP"); };
    tick();
    setInterval(tick, 1000);

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
